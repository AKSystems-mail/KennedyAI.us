<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree GLB Preview</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; background-color: #050505; }
    </style>
</head>
<body>
    <model-viewer 
        src="http://localhost:8080/tree.glb" 
        alt="A 3D model of a tree" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1" 
        environment-image="neutral" 
        exposure="1">
    </model-viewer>
</body>
</html>
